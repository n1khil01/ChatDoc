<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ChatDoc answers questions about your PDFs with click-through citations and refuses when the it does not contain the answer."
    />
    <meta name="theme-color" content="#08080c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <title>ChatDoc: grounded answers from the truth</title>

    <script>
      // Apply the stored theme before first paint so a light-mode user never sees a
      // dark flash (and vice versa). Mirrors the logic in context/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('chatdoc-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* localStorage unavailable -- fall back to the dark default in the markup */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
